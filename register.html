<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Elderly Care Assistant</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            color: #263238;
        }

        .register-page {
            min-height: 100vh;
        }

        /* HEADER */

        .register-header {
            background: linear-gradient(135deg, #5b7cfa, #7b61ff);
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo h1 {
            font-size: 22px;
        }

        .home-btn {
            border: none;
            background: rgba(255,255,255,0.18);
            color: white;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .home-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* MAIN */

        .register-main {
            width: 92%;
            max-width: 900px;
            margin: 35px auto;
        }

        .register-card {
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.09);
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #eef1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .page-title h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #68727d;
        }

        /* SECTION */

        .form-section {
            background: #f8faff;
            border: 1px solid #e2e7f0;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 22px;
        }

        .form-section h3 {
            color: #3549a3;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d6dce6;
            border-radius: 9px;
            background: white;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
        }

        /* BUTTON */

        .create-button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #7b61ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 6px 18px rgba(102,126,234,0.25);
        }

        .create-button:hover {
            transform: translateY(-1px);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #68727d;
            font-size: 14px;
        }

        .login-text a {
            color: #596bd5;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .register-footer {
            text-align: center;
            padding: 25px;
            color: #7b8490;
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .register-header {
                padding: 18px 20px;
            }

            .logo h1 {
                font-size: 18px;
            }

            .register-main {
                width: 94%;
            }

            .register-card {
                padding: 25px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>

<div class="register-page">


    <!-- HEADER -->

    <header class="register-header">

        <div class="logo">

            <div class="logo-icon">
                🩺
            </div>

            <h1>
                Smart Elderly Care Assistant
            </h1>

        </div>


        <button
            class="home-btn"
            onclick="goHome()">

            🏠 Home

        </button>

    </header>



    <!-- MAIN -->

    <main class="register-main">

        <div class="register-card">


            <!-- TITLE -->

            <div class="page-title">

                <div class="page-icon">
                    📝
                </div>

                <h2>
                    Create Your Account
                </h2>

                <p>
                    Create your personalized elderly care profile.
                </p>

            </div>



            <!-- REGISTRATION FORM -->

            <form id="registerForm">


                <!-- PERSONAL INFORMATION -->

                <div class="form-section">

                    <h3>
                        👤 Personal Information
                    </h3>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="dob">
                                Date of Birth
                            </label>

                            <input
                                type="date"
                                id="dob"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter phone number"
                                required>

                        </div>


                        <div class="form-group full">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required>

                        </div>


                    </div>

                </div>



                <!-- MEDICAL INFORMATION -->

                <div class="form-section">

                    <h3>
                        🏥 Medical Information
                    </h3>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="bloodGroup">
                                Blood Group
                            </label>

                            <select id="bloodGroup">

                                <option value="">
                                    Select Blood Group
                                </option>

                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="conditions">
                                Medical Conditions
                            </label>

                            <input
                                type="text"
                                id="conditions"
                                placeholder="Example: Diabetes, BP">

                        </div>


                        <div class="form-group full">

                            <label for="allergies">
                                Allergies
                            </label>

                            <textarea
                                id="allergies"
                                placeholder="List any known allergies"></textarea>

                        </div>


                    </div>

                </div>



                <!-- MEDICINE INFORMATION -->

                <div class="form-section">

                    <h3>
                        💊 Medicine Information
                    </h3>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="medicineName">
                                Medicine Name
                            </label>

                            <input
                                type="text"
                                id="medicineName"
                                placeholder="Example: Paracetamol">

                        </div>


                        <div class="form-group">

                            <label for="dosage">
                                Dosage
                            </label>

                            <input
                                type="text"
                                id="dosage"
                                placeholder="Example: 500 mg">

                        </div>


                        <div class="form-group">

                            <label for="period">
                                Period
                            </label>

                            <select id="period">

                                <option value="Daily">
                                    Daily
                                </option>

                                <option value="Morning">
                                    Morning
                                </option>

                                <option value="Afternoon">
                                    Afternoon
                                </option>

                                <option value="Night">
                                    Night
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="time">
                                Medicine Time
                            </label>

                            <input
                                type="time"
                                id="time">

                        </div>


                    </div>

                </div>



                <!-- CAREGIVER -->

                <div class="form-section">

                    <h3>
                        👨‍👩‍👧 Emergency / Caregiver Contact
                    </h3>


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="caregiverName">
                                Caregiver Name
                            </label>

                            <input
                                type="text"
                                id="caregiverName"
                                placeholder="Enter caregiver name">

                        </div>
                        <div class="form-group">

                            <label for="caregiverEmail">
                                Caregiver Email
                            </label>

                        <input
                            type="email"
                            id="caregiverEmail"
                            placeholder="Enter caregiver email">

                        </div>

                        <div class="form-group">

                            <label for="relationship">
                                Relationship
                            </label>

                            <input
                                type="text"
                                id="relationship"
                                placeholder="Example: Daughter">

                        </div>


                        <div class="form-group full">

                            <label for="caregiverPhone">
                                Caregiver Phone
                            </label>

                            <input
                                type="tel"
                                id="caregiverPhone"
                                placeholder="Enter caregiver phone">

                        </div>


                    </div>

                </div>



                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="create-button">

                    📝 Create Account

                </button>


            </form>



            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </main>



    <!-- FOOTER -->

    <footer class="register-footer">

        © 2026 Smart Elderly Care Assistant

    </footer>


</div>



<script>

    function goHome() {

        window.location.href =
            "index.html";

    }


    document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const userData = {

                name:
                    document.getElementById("name").value,

                dob:
                    document.getElementById("dob").value,

                email:
                    document.getElementById("email").value,

                phone:
                    document.getElementById("phone").value,

                password:
                    document.getElementById("password").value,

                bloodGroup:
                    document.getElementById("bloodGroup").value,

                conditions:
                    document.getElementById("conditions").value,

                allergies:
                    document.getElementById("allergies").value,

                caregiverName:
                    document.getElementById("caregiverName").value,
                

                caregiverEmail:
                    document.getElementById("caregiverEmail").value,

                relationship:
                    document.getElementById("relationship").value,

                caregiverPhone:
                    document.getElementById("caregiverPhone").value

            };


            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(userData)
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Registration failed."
                    );

                    return;
                }


                /*
                 * If medicine details were entered,
                 * save the medicine after creating
                 * the user account.
                 */

                const medicineName =
                    document.getElementById(
                        "medicineName"
                    ).value;

                const dosage =
                    document.getElementById(
                        "dosage"
                    ).value;

                const period =
                    document.getElementById(
                        "period"
                    ).value;

                const time =
                    document.getElementById(
                        "time"
                    ).value;


                if (
                    medicineName &&
                    dosage &&
                    time
                ) {

                    await fetch(
                        "http://localhost:5000/api/medicine/add",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                userId:
                                    data.userId,

                                medicineName:
                                    medicineName,

                                dosage:
                                    dosage,

                                period:
                                    period,

                                time:
                                    time

                            })
                        }
                    );

                }


                alert(
                    "Account created successfully!"
                );


                window.location.href =
                    "login.html";


            }

            catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                alert(
                    "Unable to connect to the server. " +
                    "Please make sure your backend is running."
                );

            }

        });

</script>


</body>

</html>
