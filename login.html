<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Elderly Care Assistant</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8f9ff
            );
        }

        /* =========================
           PAGE
           ========================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           HEADER
           ========================= */

        .login-header {
            background: linear-gradient(
                135deg,
                #5b7cfa,
                #7b61ff
            );

            color: white;

            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.12);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo h1 {
            font-size: 22px;
        }

        .home-btn {
            border: none;
            background: rgba(255,255,255,0.18);
            color: white;

            padding: 10px 18px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;
        }

        .home-btn:hover {
            background: rgba(255,255,255,0.3);
        }


        /* =========================
           MAIN
           ========================= */

        .login-main {
            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;
        }


        /* =========================
           LOGIN CARD
           ========================= */

        .login-card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.1);
        }

        .login-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #eef1ff;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 36px;
        }

        .login-card h2 {
            text-align: center;

            font-size: 30px;

            color: #263238;

            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;

            color: #68727d;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* =========================
           FORM
           ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #374151;

            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d7dce5;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102,126,234,0.12);
        }


        /* =========================
           LOGIN BUTTON
           ========================= */

        .login-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #7b61ff
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            box-shadow:
                0 6px 18px
                rgba(102,126,234,0.25);
        }

        .login-button:hover {
            transform: translateY(-1px);
        }


        /* =========================
           REGISTER LINK
           ========================= */

        .register-text {
            text-align: center;

            margin-top: 25px;

            color: #68727d;

            font-size: 14px;
        }

        .register-text a {
            color: #5b6fd8;

            font-weight: bold;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }


        /* =========================
           FOOTER
           ========================= */

        .login-footer {
            text-align: center;

            padding: 20px;

            color: #7b8490;

            font-size: 13px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .login-header {
                padding: 18px 20px;
            }

            .logo h1 {
                font-size: 18px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-card h2 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="login-page">


    <!-- =========================
         HEADER
         ========================= -->

    <header class="login-header">

        <div class="logo">

            <div class="logo-icon">
                🩺
            </div>

            <h1>
                Smart Elderly Care Assistant
            </h1>

        </div>


        <button
            class="home-btn"
            onclick="goHome()">

            🏠 Home

        </button>

    </header>



    <!-- =========================
         LOGIN
         ========================= -->

    <main class="login-main">

        <div class="login-card">


            <div class="login-icon">
                🔐
            </div>


            <h2>
                Welcome Back
            </h2>


            <p class="login-subtitle">

                Login to access your
                personalized care dashboard.

            </p>



            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                onsubmit="loginUser(event)">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>



                <button
                    type="submit"
                    class="login-button">

                    🔐 Login

                </button>


            </form>



            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


        </div>

    </main>



    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="login-footer">

        © 2026 Smart Elderly Care Assistant

    </footer>


</div>



<script>

    function goHome() {

        window.location.href =
            "index.html";

    }


    /*
       LOGIN FUNCTION

       This connects to your existing
       Node.js + Express backend.
    */

    async function loginUser(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                alert("Login successful!");


                /*
                   Save logged-in user
                   for the dashboard.
                */

                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );


                /*
                   Open dashboard
                */

                window.location.href =
                    "dashboard.html";

            }

            else {

                alert(
                    data.message ||
                    "Invalid email or password."
                );

            }


        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );

            alert(
                "Unable to connect to the server. " +
                "Please make sure your backend is running."
            );

        }

    }

</script>


</body>

</html>
