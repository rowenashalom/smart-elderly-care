<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Reminder - ElderCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>💙 ElderCare</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="medical-profile.html">Medical Profile</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>


    <div class="form-container">

        <h1>💊 Medicine Reminder</h1>

        <p>
            Add your medicines and set a reminder time.
        </p>


        <form id="medicineForm">

            <label for="medicineName">
                Medicine Name
            </label>

            <input
                type="text"
                id="medicineName"
                placeholder="Example: Paracetamol"
                required
            >


            <label for="dosage">
                Dosage
            </label>

            <input
                type="text"
                id="dosage"
                placeholder="Example: 500 mg"
                required
            >


            <label for="period">
                Time of Day
            </label>

            <select id="period" required>

                <option value="">
                    Select time of day
                </option>

                <option value="Morning">
                    🌅 Morning
                </option>

                <option value="Afternoon">
                    ☀️ Afternoon
                </option>

                <option value="Night">
                    🌙 Night
                </option>

            </select>


            <label for="medicineTime">
                Medicine Time
            </label>

            <input
               type="time"
               id="time"
               required
>

            <button type="submit">
                💊 Add Medicine
            </button>

        </form>


        <br>


        <button onclick="goDashboard()">
            🏠 View Dashboard
        </button>

    </div>


    <script src="script.js"></script>

    <script>

        function goDashboard() {

            window.location.href = "dashboard.html";

        }


        function logout() {

            localStorage.removeItem("user");

            window.location.href = "login.html";

        }

    </script>

</body>

</html>
